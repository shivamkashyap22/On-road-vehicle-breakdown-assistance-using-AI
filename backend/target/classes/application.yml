# On-Road Vehicle Breakdown Assistance - Spring Boot Configuration
# MCA Final Year Project - application.yml for viva explanation

spring:
  application:
    name: breakdown-assistance

  datasource:
    url: jdbc:mysql://localhost:3306/breakdown_assistance
    username: root
    password: root1234  
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8080

jwt:
  secret: breakdown-assistance-jwt-secret-key-256-bits-minimum-for-HS256
  expiration-ms: 86400000

openai:
  api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
  model: gpt-3.5-turbo
  url: https://api.openai.com/v1/chat/completions